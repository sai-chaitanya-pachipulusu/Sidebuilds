services:
  - type: web
    name: sidebuilds-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: USE_SQLITE
        value: false
      - key: JWT_SECRET
        sync: false # Means this will be a secret managed in the Render dashboard
      - key: DATABASE_URL
        sync: false # Means this will be a secret managed in the Render dashboard
      - key: CLIENT_URL
        value: https://sidebuilds.online
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "SideBuilds <noreply@sidebuilds.online>"
      - key: LOG_LEVEL
        value: info
    autoDeploy: true # This is optional, enables auto deployments on pushes to the connected repo
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: https://sidebuilds.online
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate 