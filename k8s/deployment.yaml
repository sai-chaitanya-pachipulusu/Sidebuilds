apiVersion: apps/v1
kind: Deployment
metadata:
  name: sideproject-tracker
  labels:
    app: sideproject-tracker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sideproject-tracker
  template:
    metadata:
      labels:
        app: sideproject-tracker
    spec:
      containers:
      - name: app
        image: sideproject-tracker:latest
        ports:
        - containerPort: 5001
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secret
              key: secret-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sideproject-tracker-service
spec:
  selector:
    app: sideproject-tracker
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5001
  type: LoadBalancer 